name: gitnexus-grammar-skip-calibration

on:
  schedule:
    - cron: '0 7 * * 1'
  pull_request:
    paths:
      - '.devcontainer/versions.env'
      - '.devcontainer/scripts/calibrate-gitnexus-grammar-skip.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitnexus-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: devcontainers/ci@b63b30de439b47a52267f241112c5b453b673db5  # v0.3.1900000449
        with:
          runCmd: |
            set -euo pipefail
            if bash .devcontainer/scripts/calibrate-gitnexus-grammar-skip.sh; then
              {
                echo "## GitNexus grammar-skip calibration — PASS"
                echo "GITNEXUS_SKIP_OPTIONAL_GRAMMARS=1 contract honored at pinned GitNexus tag."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              SCRIPT_EXIT=$?
              {
                echo "## GitNexus grammar-skip calibration — FAIL or DRIFT (exit $SCRIPT_EXIT)"
                echo ""
                echo "**Mechanism:** FR-4b calibration"
                echo "**Offending artifact:** .devcontainer/scripts/calibrate-gitnexus-grammar-skip.sh (exit $SCRIPT_EXIT)"
                echo "**Rule violated:** GITNEXUS_SKIP_OPTIONAL_GRAMMARS=1 contract per ADR-0058"
                echo "**Remedial hint:** inspect the latest calibration_result event in .claude/runtime/mcp-events.jsonl (signals map); if outcome=drift_detected, refresh the regex or rescope per the Issues/fr4b-signal1-regex-drift analysis"
              } >> "$GITHUB_STEP_SUMMARY"
              exit "$SCRIPT_EXIT"
            fi
