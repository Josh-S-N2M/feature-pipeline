# High-priority failure modes recovered from the run synthesis (§3), grouped by category.
# Each: the originating rule/AP, the concrete failure mode, and the detection mechanism.
failure_modes_high_priority:
  A_gate_never_fires:
    - origin: [R2]
      mode: "coordinator skips a declared gate on a reconciliation re-entry path"
      detection: "assert a `gate.result` precedes every downstream `stage.start` per edge"
    - origin: [R3]
      mode: "a manifest edge has no gate, or a malformed manifest loads silently"
      detection: "JSON-Schema-validate `pipelines.yaml` + the 'every edge has a gate' sentinel; coordinator refuses a schema-invalid manifest"
    - origin: [R8]
      mode: "the sentinel itself never runs (a CI trigger misses a path)"
      detection: "branch-protection audit + a canary commit that introduces a deliberate orphan and asserts CI goes red"
    - origin: [R13, A8]
      mode: "a gate decides but emits no event (unmeasurable, unprunable)"
      detection: "harness wraps every gate so emission is inseparable from running; conformance cross-checks manifest gates against distinct gate ids in a reference run"
  B_gate_fires_but_lies:
    - origin: [R2]
      mode: "a validator throws and the coordinator treats the error as pass (fails open)"
      detection: "`gate.result` carries explicit pass/fail/error; a fixture injects a crash and asserts the run halts"
    - origin: [R6]
      mode: "a soft-fail / default-substitution branch defeats fail-loud"
      detection: "scan validators for `except: pass` and `.get(key, DEFAULT)` on required fields; fault-injection feeds malformed contracts"
    - origin: [R13]
      mode: "the emitted verdict disagrees with the decision the coordinator acted on"
      detection: "serialize the *same* verdict object; assert any halt has a matching blocking `fail` event"
  C_independence_collapses:
    - origin: [R4, A3]
      mode: "a producer self-check is mistaken for the independent boundary gate"
      detection: "assert author id != validator id on the boundary `gate.result`"
    - origin: [R20, A20]
      mode: "a provider outage or a single abstain default-passes the reviewer panel"
      detection: "unit-test the resolution truth table (any fail->fail, any abstain->escalate, no-quorum->fail-closed)"
  D_staleness_ships_silently:
    - origin: [R11, A11]
      mode: "the reverse-closure walk seeds from the manifest while digests live on the `derived_from` graph"
      detection: "a bijection completeness check between the two graphs (every `derived_from` edge maps to a manifest lineage edge)"
    - origin: [R9]
      mode: "content changes without a version bump"
      detection: "CI compares the canonicalized content digest to the digest recorded for the declared version"
  E_side_effects_duplicate_or_vanish:
    - origin: [R21, A21]
      mode: "key minted per-stage not per-side-effect, or the cycle term dropped"
      detection: "static check (N writes => N keys); crash-injection in both windows asserts exactly-once; a reconciliation regression asserts a cycle-2 write is not suppressed"
  F_orphans_survive_removal:
    - origin: [R14, R15, A15]
      mode: "the orphan check scans project scope only, returns clean while a user-scope install lingers"
      detection: "enumerate project + user + MCP-config + devcontainer scopes; an unscanned required scope downgrades 'clean' to 'inconclusive'"
