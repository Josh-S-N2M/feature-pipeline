# Failure-modes catalog — single source of truth (the "how we catch the bad" half)
#
# For every rule (R*) and anti-pattern (A*), the failure modes it guards against —
# enumerated via software guidewords + misuse-case hunting (SW-FMEA; no numeric RPN) —
# each mapped to what-good-looks-like (preventive, in the rule text) AND a concrete
# DETECTION mechanism. This is the bridge the rules need: a rule says what good looks
# like; this catalog says how the bad is caught. (Decision D-FM-1.)
#
# PROVENANCE + STATUS (read this): generated from the `failure-mode-catalog` run
# 2026-05-30 (wf_57a4b063-988; 72 concerns scanned, 16 coverage gaps, 213 failure modes
# over R1-R24 + A1-A24). The run's *structured* 213-row output was not persisted before
# the scratch file was cleaned, so this file currently carries:
#   - `coverage_gaps_closed`: the missing concerns the scan found, each mapped to the NEW
#     rule/anti-pattern that now closes it (R25-R40, A25-A29, D-KN-5) — the durable win.
#   - `failure_modes_high_priority`: the high-priority subset faithfully recovered from the
#     run synthesis (failure-mode-catalog.OUTPUT.md §3), grouped by failure category.
# THE FULL 213-MODE CATALOG IS REGENERATED by re-running `failure-mode-catalog` (which now
# also covers R25-R40 / A25-A29) — and that re-run MUST write its structured output here
# directly. Detection cells naming a not-yet-built check are WS-0/WS-1 forward references.
#
# CONSUMED BY: the WS-0 drift sentinel (each `detection` should map to a real check) and
# the `failure-mode-catalog` / `design-review` workflows.

version: 0.9.0   # 0.9 = high-priority seed; bumps to 1.0.0 when a re-run writes the full catalog
