# Build a multi-arch Docker image and push to GitHub Container Registry (GHCR)
# with a Sigstore-backed build provenance attestation.
#
# Tags applied:
# - On push to main: 'main', 'sha-<full-sha>'
# - On semver tag: '1.2.3', '1.2', '1', 'latest'
# - On PR: 'pr-<number>'
#
# Prerequisites:
# - Repo has a Dockerfile (or set 'file' below).
# - Org/repo allows packages: write for GITHUB_TOKEN (default for most repos).

name: Build and push container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write       # push to GHCR
  id-token: write       # for attestations
  attestations: write   # for attestations

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3  # TODO: SHA pin
        # Required for cross-architecture builds (linux/arm64 from x86_64 host)

      - uses: docker/setup-buildx-action@v3  # TODO: SHA pin

      - name: Log in to GHCR
        uses: docker/login-action@v3  # TODO: SHA pin
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5  # TODO: SHA pin
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6  # TODO: SHA pin
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2  # TODO: SHA pin
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
