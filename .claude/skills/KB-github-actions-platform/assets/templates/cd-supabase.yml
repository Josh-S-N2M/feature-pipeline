# Deploy to Supabase: apply database migrations and deploy Edge Functions.
#
# Prerequisites:
# 1. Get a personal access token from Supabase (Account → Access Tokens).
#    Store as repo secret SUPABASE_ACCESS_TOKEN.
# 2. Find your project's reference ID in the Supabase dashboard URL or
#    Settings → General. Store as repo secret SUPABASE_PROJECT_ID.
# 3. Get the database password (Settings → Database → Connection info).
#    Store as repo secret SUPABASE_DB_PASSWORD.
# 4. Configure repo Settings → Environments → 'production' with required
#    reviewers (recommended for prod migrations — they're hard to roll back).
#
# Repo layout assumed:
#   supabase/
#     migrations/         # SQL migration files
#     functions/
#       my-function/
#         index.ts
#     config.toml
#
# For PR previews, consider Supabase Branching (configured via the GitHub
# integration in the Supabase dashboard, not via this workflow).

name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1  # TODO: SHA pin
        with:
          version: latest

      - name: Verify CLI
        run: supabase --version

      - name: Link to project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Push database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          # Deploy all functions in supabase/functions/
          for fn_dir in supabase/functions/*/; do
            fn_name="$(basename "$fn_dir")"
            # Skip the _shared directory (convention for shared code)
            if [ "$fn_name" = "_shared" ]; then continue; fi
            echo "Deploying function: $fn_name"
            supabase functions deploy "$fn_name" --project-ref "$PROJECT_ID"
          done

      - name: Summary
        run: |
          {
            echo "## Supabase deploy complete"
            echo ""
            echo "- Project: \`$PROJECT_ID\`"
            echo "- Migrations applied from \`supabase/migrations/\`"
            echo "- Functions deployed from \`supabase/functions/\`"
          } >> "$GITHUB_STEP_SUMMARY"
