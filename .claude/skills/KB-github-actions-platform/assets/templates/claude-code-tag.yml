# Claude Code in CI: respond to @claude mentions in PRs and issues.
#
# Prerequisites:
# 1. Install the @claude GitHub App: https://github.com/apps/claude
#    (or set up a custom app — see references/claude-code-cicd.md.)
# 2. Add ANTHROPIC_API_KEY to repo secrets.
#
# Cost note: The if: filter below is critical. Without the author_association
# check, anyone who can comment on the repo can spend your API budget.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

# Only one Claude run per PR/issue at a time; cancel stale runs on new comments.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    # Fire only when:
    # - The relevant body field contains @claude, AND
    # - The actor is a trusted association (excludes random external commenters)
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) &&
      (
        github.event.sender.login == github.event.repository.owner.login ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # so Claude can commit code changes
      pull-requests: write  # so Claude can open PRs and comment
      issues: write         # so Claude can comment on issues
      id-token: write       # for OIDC if Claude needs cloud auth (optional)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0     # full history; useful for git blame / log

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1  # TODO: SHA pin
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # No prompt: → interactive mode; Claude reads the comment that triggered it.
          claude_args: |
            --max-turns 10
            --model claude-sonnet-4-6
