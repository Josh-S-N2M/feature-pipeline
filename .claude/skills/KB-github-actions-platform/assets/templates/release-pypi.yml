# Publish to PyPI using Trusted Publishing (no API token needed).
#
# Prerequisites (one-time):
# 1. On PyPI: project settings → Publishing → Add a trusted publisher.
#    - Owner: <your GitHub user/org>
#    - Repository: <repo name>
#    - Workflow filename: release-pypi.yml
#    - Environment name: pypi (must match the `environment:` below)
# 2. Configure repo Settings → Environments → 'pypi' (optionally with required
#    reviewers).
#
# To publish: create a GitHub release with a tag like 'v1.2.3'. The workflow
# reads pyproject.toml's version, builds wheels and sdist, and publishes.

name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g. v1.2.3)'
        type: string
        required: true

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

concurrency:
  group: release-pypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Verify version matches tag
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${REF_NAME#v}"
          pkg_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Tag ($tag) does not match pyproject.toml version ($pkg_version)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    steps:
      - uses: actions/download-artifact@v5  # TODO: SHA pin
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@v1  # TODO: SHA pin
        with:
          packages-dir: dist/
          # No password — Trusted Publishing uses OIDC

      - name: Summary
        run: |
          {
            echo "## Published to PyPI"
            echo ""
            ls -la dist/ | tail -n +2
          } >> "$GITHUB_STEP_SUMMARY"
