# Claude Code in CI: run via Amazon Bedrock instead of the direct Anthropic API.
#
# Use this when you need data residency on AWS, want consolidated AWS billing,
# or already have a Bedrock workload.
#
# Prerequisites:
# 1. Enable Amazon Bedrock and request access to Claude models in your AWS account.
#    Repeat in every region you'll use (Bedrock cross-region models route across
#    several regions; request access in all of them).
# 2. Create a custom GitHub App (recommended for enterprise; see references/claude-code-cicd.md).
#    Store APP_ID and APP_PRIVATE_KEY as repo secrets.
# 3. Set up GitHub OIDC in AWS (one-time per AWS account):
#    - Add an OIDC identity provider in IAM:
#        URL:      https://token.actions.githubusercontent.com
#        Audience: sts.amazonaws.com
#    - Create an IAM role 'github-claude-bedrock' with policy AmazonBedrockFullAccess
#      (or a tighter custom policy scoped to the specific Claude model ARNs).
#    - Trust policy: scope to repo:OWNER/REPO:* (and ideally to a specific environment).
# 4. Store the role ARN as repo secret AWS_ROLE_TO_ASSUME.

name: Claude Code (Bedrock)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write       # required for AWS OIDC

concurrency:
  group: claude-bedrock-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      ) &&
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-west-2     # adjust to your Bedrock-enabled region
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2  # TODO: SHA pin
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4  # TODO: SHA pin
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: gh-claude-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: anthropics/claude-code-action@v1  # TODO: SHA pin
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          # Bedrock model IDs are region-prefixed.
          # See https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles-support.html
          claude_args: |
            --model us.anthropic.claude-sonnet-4-6
            --max-turns 10
